<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" role="img" aria-label="Request flow from the web UI through FastAPI and the scikit-learn pipeline back to a score" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#566A7B"/></marker></defs><rect x=".5" y=".5" width="1099" height="249" rx="20" fill="#F5F8FA" stroke="#D5DEE5"/><rect x="30" y="60" width="180" height="110" rx="14" fill="#fff" stroke="#D5DEE5"/><rect x="30" y="60" width="180" height="8" rx="4" fill="#1E8C8A"/><text x="120" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#12263A" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Web UI</text><text x="120" y="128" text-anchor="middle" font-size="14" fill="#566A7B" font-family="'Segoe UI',Helvetica,Arial,sans-serif">HTML, CSS, JS</text><text x="120" y="150" text-anchor="middle" font-size="14" fill="#566A7B" font-family="'Segoe UI',Helvetica,Arial,sans-serif">12 inputs</text><line x1="216" y1="115" x2="239" y2="115" stroke="#566A7B" stroke-width="2" marker-end="url(#a)"/><rect x="245" y="60" width="180" height="110" rx="14" fill="#fff" stroke="#D5DEE5"/><rect x="245" y="60" width="180" height="8" rx="4" fill="#4A5FC1"/><text x="335" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#12263A" font-family="'Segoe UI',Helvetica,Arial,sans-serif">FastAPI</text><text x="335" y="128" text-anchor="middle" font-size="14" fill="#566A7B" font-family="'Segoe UI',Helvetica,Arial,sans-serif">POST /predict</text><text x="335" y="150" text-anchor="middle" font-size="14" fill="#566A7B" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Pydantic validation</text><line x1="431" y1="115" x2="454" y2="115" stroke="#566A7B" stroke-width="2" marker-end="url(#a)"/><rect x="460" y="60" width="180" height="110" rx="14" fill="#fff" stroke="#D5DEE5"/><rect x="460" y="60" width="180" height="8" rx="4" fill="#E9A93A"/><text x="550" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#12263A" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Feature prep</text><text x="550" y="128" text-anchor="middle" font-size="14" fill="#566A7B" font-family="'Segoe UI',Helvetica,Arial,sans-serif">pandas DataFrame</text><text x="550" y="150" text-anchor="middle" font-size="14" fill="#566A7B" font-family="'Segoe UI',Helvetica,Arial,sans-serif">+ Grouped_Country</text><line x1="646" y1="115" x2="669" y2="115" stroke="#566A7B" stroke-width="2" marker-end="url(#a)"/><rect x="675" y="60" width="180" height="110" rx="14" fill="#fff" stroke="#D5DEE5"/><rect x="675" y="60" width="180" height="8" rx="4" fill="#CF5367"/><text x="765" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#12263A" font-family="'Segoe UI',Helvetica,Arial,sans-serif">sklearn Pipeline</text><text x="765" y="128" text-anchor="middle" font-size="14" fill="#566A7B" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Scale and encode</text><text x="765" y="150" text-anchor="middle" font-size="14" fill="#566A7B" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Random Forest</text><line x1="861" y1="115" x2="884" y2="115" stroke="#566A7B" stroke-width="2" marker-end="url(#a)"/><rect x="890" y="60" width="180" height="110" rx="14" fill="#fff" stroke="#D5DEE5"/><rect x="890" y="60" width="180" height="8" rx="4" fill="#1E8C8A"/><text x="980" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#12263A" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Score</text><text x="980" y="128" text-anchor="middle" font-size="14" fill="#566A7B" font-family="'Segoe UI',Helvetica,Arial,sans-serif">0 to 10</text><text x="980" y="150" text-anchor="middle" font-size="14" fill="#566A7B" font-family="'Segoe UI',Helvetica,Arial,sans-serif">animated gauge</text><text x="550" y="212" text-anchor="middle" font-size="14" fill="#566A7B" font-family="'Segoe UI',Helvetica,Arial,sans-serif">The UI and the API are served by the same FastAPI app, deployed as one web service on Render.</text></svg>